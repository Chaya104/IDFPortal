<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGINT OPS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Wrapper -->
  <div class="app-layout">

    <!-- 1. Header Bar -->
    <header class="navbar">
      <div class="nav-shield-btn" tabindex="0" title="System Security Status">
        <div class="shield-circle">
          <svg viewBox="0 0 24 24" class="shield-svg">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.1-2.73 7.92-6 8.89-3.27-.97-6-4.79-6-8.89V6.43l6-2.25z"/>
          </svg>
        </div>
      </div>

      <div class="nav-title">
        <span>SIGINT OPS</span>
      </div>

      <div class="nav-status-btn" tabindex="0">
        <span class="status-pulse-dot"></span>
        <span class="status-text">&bull; SECURE &bull; ONLINE</span>
      </div>
    </header>

    <!-- Main Content Dashboard -->
    <main class="main-viewport">

      <!-- 2. Scanner Box -->
      <section class="scanner-panel" tabindex="0">
        <div class="radar-container">
          <div class="radar-display">
            <!-- Grid Lines & Rings -->
            <div class="radar-grid-h"></div>
            <div class="radar-grid-v"></div>
            <div class="radar-circle circle-lg"></div>
            <div class="radar-circle circle-md"></div>
            <div class="radar-circle circle-sm"></div>

            <!-- Rotating Radar Sweep Beam -->
            <div class="radar-beam"></div>

            <!-- Target Blips -->
            <span class="blip target-alpha"></span>
            <span class="blip target-bravo"></span>
            <span class="blip target-charlie"></span>
          </div>
        </div>

        <div class="scanner-data">
          <div class="data-group">
            <div class="counter-number">24</div>
            <div class="counter-caption">ACTIVE SIGNALS</div>
          </div>
          <div class="data-group">
            <div class="counter-number">07</div>
            <div class="counter-caption">PRIORITY ALERTS</div>
          </div>
        </div>
      </section>

      <!-- 3. Action Buttons Row -->
      <section class="actions-strip">
        <button class="tactical-btn" type="button">
          <span class="btn-symbol">+</span>
          <span>New Brief</span>
        </button>
        <button class="tactical-btn" type="button">
          <span class="btn-symbol">&lt;&gt;</span>
          <span>Decode</span>
        </button>
        <button class="tactical-btn" type="button">
          <svg class="btn-symbol-svg" viewBox="0 0 24 24">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
          <span>Request Drone</span>
        </button>
      </section>

      <!-- 4. Intelligence Cards Grid -->
      <section class="intel-cards-container">

        <!-- Card 1 -->
        <article class="intel-card border-accent-green" tabindex="0">
          <div class="card-top-row">
            <span class="badge badge-critical">CRITICAL</span>
            <span class="card-status-text">In Progress</span>
          </div>
          <h4 class="card-heading">Operation Nightfall</h4>
          <div class="meter-wrapper">
            <div class="meter-track">
              <div class="meter-fill fill-green" style="width: 65%;"></div>
            </div>
            <span class="meter-val">65%</span>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="intel-card border-accent-yellow" tabindex="0">
          <div class="card-top-row">
            <span class="badge badge-high">HIGH</span>
            <span class="card-status-text">Analyzing</span>
          </div>
          <h4 class="card-heading">Signal Intercept Alpha</h4>
          <div class="meter-wrapper">
            <div class="meter-track">
              <div class="meter-fill fill-green" style="width: 48%;"></div>
            </div>
            <span class="meter-val">48%</span>
          </div>
        </article>

        <!-- Card 3 -->
        <article class="intel-card border-accent-green" tabindex="0">
          <div class="card-top-row">
            <span class="badge badge-medium">MEDIUM</span>
            <span class="card-status-text">Pending</span>
          </div>
          <h4 class="card-heading">Asset Recovery</h4>
          <div class="meter-wrapper">
            <div class="meter-track">
              <div class="meter-fill fill-green" style="width: 15%;"></div>
            </div>
            <span class="meter-val">15%</span>
          </div>
        </article>

        <!-- Card 4 -->
        <article class="intel-card border-accent-yellow" tabindex="0">
          <div class="card-top-row">
            <span class="badge badge-high">HIGH</span>
            <span class="card-status-text">Active</span>
          </div>
          <h4 class="card-heading">Cyber Defense Grid</h4>
          <div class="meter-wrapper">
            <div class="meter-track">
              <div class="meter-fill fill-green" style="width: 90%;"></div>
            </div>
            <span class="meter-val">90%</span>
          </div>
        </article>

      </section>

      <!-- 5. Threat Alert Strip -->
      <section class="threat-alert-panel" tabindex="0">
        <span class="threat-beacon"></span>
        <span class="threat-headline">THREAT DETECTED</span>
      </section>

    </main>

    <!-- 6. Bottom Navigation Bar -->
    <nav class="bottom-dock">
      <div class="dock-items">
        <a href="#dashboard" class="dock-link active">
          <svg class="dock-icon-svg pulse-svg" viewBox="0 0 24 24">
            <polyline points="2,12 6,12 9,4 15,20 18,12 22,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="dock-label">Dashboard</span>
        </a>

        <a href="#feed" class="dock-link">
          <svg class="dock-icon-svg" viewBox="0 0 24 24">
            <path d="M4.93 4.93A10 10 0 0 0 2 12a10 10 0 0 0 2.93 7.07M19.07 4.93A10 10 0 0 1 22 12a10 10 0 0 1-2.93 7.07M7.76 7.76A6 6 0 0 0 6 12a6 6 0 0 0 1.76 4.24M16.24 7.76A6 6 0 0 1 18 12a6 6 0 0 1-1.76 4.24M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="dock-label">Feed</span>
        </a>

        <a href="#intel" class="dock-link">
          <svg class="dock-icon-svg" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="dock-label">Brief</span>
        </a>
      </div>

      <div class="dock-help">
        <button class="help-btn" type="button" title="Help">?</button>
      </div>
    </nav>

  </div>

</body>
</html>
